<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Mermaid Live Editor</title>
    <meta name="description" content="Admin panel for Mermaid Live Editor" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">

    <!-- Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>

  <body class="h-full bg-gradient-to-br from-slate-50 via-white to-slate-50">
    <!-- Auth Guard -->
    <script src="assets/js/users.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      if (!requireAdmin()) {
        // requireAdmin already redirects
      }
    </script>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
      <div class="px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- Left Section -->
          <div class="flex items-center gap-3">
            <a href="index.html" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-indigo-600 transition-all duration-200" title="Kembali ke Editor">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
              </svg>
            </a>
            <div>
              <h1 class="text-lg font-bold text-slate-900">Admin Panel</h1>
              <p class="text-xs text-slate-500">User Management</p>
            </div>
          </div>

          <!-- Right Section -->
          <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-indigo-50 rounded-lg">
              <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <span id="admin-username" class="text-sm font-medium text-indigo-700">admin</span>
              <span class="px-1.5 py-0.5 bg-indigo-200 text-indigo-800 text-xs rounded-full font-medium">Admin</span>
            </div>
            <a href="index.html" class="flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-all duration-200 text-sm font-medium">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
              <span class="hidden sm:inline">Editor</span>
            </a>
            <button onclick="logout()" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all duration-200 text-sm font-medium">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              <span class="hidden sm:inline">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">
      <!-- Stats Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-100 rounded-lg">
              <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </div>
            <div>
              <p class="text-2xl font-bold text-slate-900" id="stat-total">0</p>
              <p class="text-xs text-slate-500">Total Users</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-purple-100 rounded-lg">
              <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
              </svg>
            </div>
            <div>
              <p class="text-2xl font-bold text-slate-900" id="stat-admins">0</p>
              <p class="text-xs text-slate-500">Admin</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-emerald-100 rounded-lg">
              <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <div>
              <p class="text-2xl font-bold text-slate-900" id="stat-users">0</p>
              <p class="text-xs text-slate-500">Regular Users</p>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Add New User -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 bg-gradient-to-r from-indigo-600 to-purple-600">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
              </svg>
              Tambah User Baru
            </h2>
          </div>
          <div class="p-6">
            <form id="add-user-form" onsubmit="handleAddUser(event)">
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                  <input type="text" id="new-username" placeholder="Masukkan username" required
                    class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                  <input type="password" id="new-password" placeholder="Masukkan password" required
                    class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Konfirmasi Password</label>
                  <input type="password" id="new-password-confirm" placeholder="Konfirmasi password" required
                    class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                  <select id="new-role" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 bg-white">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>

                <div id="add-error" class="hidden">
                  <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span id="add-error-text">Error message</span>
                  </div>
                </div>

                <div id="add-success" class="hidden">
                  <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2 rounded-lg text-sm">
                    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                    <span id="add-success-text">User berhasil ditambahkan!</span>
                  </div>
                </div>

                <button type="submit" id="add-user-btn"
                  class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 shadow-md hover:shadow-lg transition-all duration-200 text-sm font-semibold">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                  </svg>
                  Tambah User
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Hash Generator Tool -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 bg-gradient-to-r from-slate-700 to-slate-800">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
              </svg>
              Hash Generator
            </h2>
            <p class="text-slate-300 text-xs mt-0.5">Generate SHA-256 hash untuk file users.js</p>
          </div>
          <div class="p-6">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="text" id="hash-input" placeholder="Masukkan password untuk di-hash"
                  class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 font-mono">
              </div>
              <button onclick="generateHash()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition-all duration-200 text-sm font-semibold">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Generate Hash
              </button>
              <div id="hash-result" class="hidden">
                <label class="block text-sm font-medium text-slate-700 mb-1">SHA-256 Hash</label>
                <div class="relative">
                  <input type="text" id="hash-output" readonly
                    class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 font-mono text-slate-700 pr-20">
                  <button onclick="copyHash()" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 bg-indigo-100 text-indigo-700 rounded text-xs font-medium hover:bg-indigo-200 transition-colors">
                    Copy
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Users Table -->
      <div class="mt-8 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
          <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Daftar Users
          </h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-slate-200">
                <th class="text-left text-xs font-semibold text-slate-600 uppercase tracking-wider px-6 py-3">Username</th>
                <th class="text-left text-xs font-semibold text-slate-600 uppercase tracking-wider px-6 py-3">Role</th>
                <th class="text-left text-xs font-semibold text-slate-600 uppercase tracking-wider px-6 py-3">Tipe</th>
                <th class="text-left text-xs font-semibold text-slate-600 uppercase tracking-wider px-6 py-3">Password Hash</th>
                <th class="text-right text-xs font-semibold text-slate-600 uppercase tracking-wider px-6 py-3">Aksi</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // Set admin username
      const currentUser = getCurrentUser();
      if (currentUser) {
        document.getElementById('admin-username').textContent = currentUser.username;
      }

      // Load users table
      function loadUsersTable() {
        const tbody = document.getElementById('users-table-body');
        const allUsers = getAllUsers();

        // Update stats
        document.getElementById('stat-total').textContent = allUsers.length;
        document.getElementById('stat-admins').textContent = allUsers.filter(u => u.role === 'admin').length;
        document.getElementById('stat-users').textContent = allUsers.filter(u => u.role === 'user').length;

        tbody.innerHTML = '';

        allUsers.forEach(user => {
          const isConfigUser = !isLocalUser(user.username);
          const isSelf = currentUser && currentUser.username === user.username;

          const row = document.createElement('tr');
          row.className = 'border-b border-slate-100 hover:bg-slate-50 transition-colors';
          row.innerHTML = `
            <td class="px-6 py-3">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full ${user.role === 'admin' ? 'bg-indigo-100' : 'bg-slate-100'} flex items-center justify-center">
                  <span class="text-xs font-semibold ${user.role === 'admin' ? 'text-indigo-600' : 'text-slate-600'}">${user.username.charAt(0).toUpperCase()}</span>
                </div>
                <div>
                  <span class="text-sm font-medium text-slate-900">${user.username}</span>
                  ${isSelf ? '<span class="ml-1 text-xs text-indigo-500">(anda)</span>' : ''}
                </div>
              </div>
            </td>
            <td class="px-6 py-3">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                user.role === 'admin'
                  ? 'bg-indigo-100 text-indigo-800'
                  : 'bg-slate-100 text-slate-800'
              }">
                ${user.role === 'admin' ? 'Admin' : 'User'}
              </span>
            </td>
            <td class="px-6 py-3">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${
                isConfigUser
                  ? 'bg-amber-50 text-amber-700 border border-amber-200'
                  : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
              }">
                ${isConfigUser ? 'Config' : 'Local'}
              </span>
            </td>
            <td class="px-6 py-3">
              <span class="text-xs font-mono text-slate-500 truncate block max-w-[200px]" title="${user.passwordHash}">${user.passwordHash.substring(0, 20)}...</span>
            </td>
            <td class="px-6 py-3 text-right">
              ${isSelf ? `
                <span class="text-xs text-slate-400 italic">Cannot delete</span>
              ` : isConfigUser ? `
                <span class="text-xs text-slate-400 italic">Edit in users.js</span>
              ` : `
                <button onclick="handleDeleteUser('${user.username}')" class="inline-flex items-center gap-1 px-3 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors text-xs font-medium">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                  </svg>
                  Hapus
                </button>
              `}
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      // Add user
      async function handleAddUser(event) {
        event.preventDefault();

        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value;
        const confirm = document.getElementById('new-password-confirm').value;
        const role = document.getElementById('new-role').value;

        const errorDiv = document.getElementById('add-error');
        const errorText = document.getElementById('add-error-text');
        const successDiv = document.getElementById('add-success');

        errorDiv.classList.add('hidden');
        successDiv.classList.add('hidden');

        // Validations
        if (!username || !password) {
          errorText.textContent = 'Username dan password wajib diisi!';
          errorDiv.classList.remove('hidden');
          return;
        }

        if (username.length < 3) {
          errorText.textContent = 'Username minimal 3 karakter!';
          errorDiv.classList.remove('hidden');
          return;
        }

        if (password.length < 6) {
          errorText.textContent = 'Password minimal 6 karakter!';
          errorDiv.classList.remove('hidden');
          return;
        }

        if (password !== confirm) {
          errorText.textContent = 'Password dan konfirmasi tidak cocok!';
          errorDiv.classList.remove('hidden');
          return;
        }

        // Generate hash
        const hash = await hashPassword(password);

        // Save
        const result = addLocalUser({
          username: username,
          passwordHash: hash,
          role: role
        });

        if (!result) {
          errorText.textContent = `Username "${username}" sudah digunakan!`;
          errorDiv.classList.remove('hidden');
          return;
        }

        // Success
        document.getElementById('add-success-text').textContent = `User "${username}" berhasil ditambahkan!`;
        successDiv.classList.remove('hidden');

        // Reset form
        document.getElementById('add-user-form').reset();

        // Reload table
        loadUsersTable();
      }

      // Delete user
      function handleDeleteUser(username) {
        if (!confirm(`Hapus user "${username}"?\n\nTindakan ini tidak dapat dibatalkan.`)) {
          return;
        }
        removeLocalUser(username);
        loadUsersTable();
      }

      // Hash generator
      async function generateHash() {
        const input = document.getElementById('hash-input').value;
        if (!input) {
          alert('Masukkan password terlebih dahulu!');
          return;
        }
        const hash = await hashPassword(input);
        document.getElementById('hash-output').value = hash;
        document.getElementById('hash-result').classList.remove('hidden');
      }

      // Copy hash
      function copyHash() {
        const hashOutput = document.getElementById('hash-output');
        hashOutput.select();
        navigator.clipboard.writeText(hashOutput.value).then(() => {
          const btn = event.target;
          const origText = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = origText, 1500);
        });
      }

      // Initialize
      loadUsersTable();
    </script>
  </body>
</html>
