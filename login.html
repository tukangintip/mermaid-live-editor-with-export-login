<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mermaid Live Editor</title>
    <meta name="description" content="Login to Mermaid Live Editor" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">

    <!-- Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>

  <body class="h-full bg-gradient-to-br from-slate-50 via-white to-slate-50">
    <!-- Redirect if already logged in -->
    <script src="assets/js/users.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      if (isAuthenticated()) {
        window.location.href = 'index.html';
      }
    </script>

    <div class="min-h-full flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
          <!-- Header -->
          <div class="px-8 pt-8 pb-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-center">
            <div class="mx-auto w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mb-4">
              <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Mermaid Editor</h1>
            <p class="text-indigo-200 text-sm mt-1">Live Diagram Creator</p>
          </div>

          <!-- Login Form -->
          <div class="px-8 py-8">
            <form id="login-form" onsubmit="handleLogin(event)">
              <div class="space-y-5">
                <!-- Username -->
                <div>
                  <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                      </svg>
                    </div>
                    <input
                      type="text"
                      id="username"
                      name="username"
                      placeholder="Masukkan username"
                      required
                      autocomplete="username"
                      class="block w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 text-sm"
                    >
                  </div>
                </div>

                <!-- Password -->
                <div>
                  <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                      </svg>
                    </div>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      placeholder="Masukkan password"
                      required
                      autocomplete="current-password"
                      class="block w-full pl-10 pr-12 py-3 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 text-sm"
                    >
                    <button
                      type="button"
                      onclick="togglePasswordVisibility()"
                      class="absolute inset-y-0 right-0 pr-3 flex items-center"
                    >
                      <svg id="eye-icon" class="h-5 w-5 text-slate-400 hover:text-slate-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                      </svg>
                    </button>
                  </div>
                </div>

                <!-- Error Message -->
                <div id="error-msg" class="hidden">
                  <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span id="error-text">Username atau password salah!</span>
                  </div>
                </div>

                <!-- Login Button -->
                <button
                  type="submit"
                  id="login-btn"
                  class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:from-indigo-700 hover:to-purple-700 shadow-lg hover:shadow-xl transition-all duration-200 text-sm font-semibold"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                  </svg>
                  <span id="login-btn-text">Masuk</span>
                </button>
              </div>
            </form>
          </div>

          <!-- Footer -->
          <div class="px-8 py-4 bg-slate-50 border-t border-slate-200 text-center">
            <p class="text-xs text-slate-500">Mermaid Live Editor &copy; 2024</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
        } else {
          passwordInput.type = 'password';
          eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');
        const loginBtn = document.getElementById('login-btn');
        const loginBtnText = document.getElementById('login-btn-text');

        // Hide previous error
        errorMsg.classList.add('hidden');

        // Disable button during login
        loginBtn.disabled = true;
        loginBtnText.textContent = 'Memproses...';

        try {
          const result = await login(username, password);

          if (result.success) {
            // Show success animation
            loginBtnText.textContent = 'Berhasil!';
            loginBtn.classList.remove('from-indigo-600', 'to-purple-600');
            loginBtn.classList.add('from-emerald-500', 'to-emerald-600');

            // Redirect to editor
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 500);
          } else {
            // Show error
            errorText.textContent = result.error;
            errorMsg.classList.remove('hidden');
            
            // Shake animation
            const form = document.getElementById('login-form');
            form.classList.add('animate-shake');
            setTimeout(() => form.classList.remove('animate-shake'), 500);

            // Re-enable button
            loginBtn.disabled = false;
            loginBtnText.textContent = 'Masuk';
          }
        } catch (err) {
          errorText.textContent = 'Terjadi kesalahan saat login';
          errorMsg.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtnText.textContent = 'Masuk';
        }
      }

      // Enter key support
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const form = document.getElementById('login-form');
          form.requestSubmit();
        }
      });
    </script>

    <style>
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out;
      }
    </style>
  </body>
</html>
