<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid Live Editor - Create Beautiful Diagrams</title>
    <meta name="description" content="Create, edit, and preview Mermaid diagrams with syntax highlighting, zoom controls, and file management - all in your browser!" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/android-chrome-512x512.png">

    <!-- Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.min.js"></script>
  </head>

  <body class="h-full bg-gradient-to-br from-slate-50 via-white to-slate-50 overflow-hidden">
    <!-- Auth Guard -->
    <script src="assets/js/users.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      if (sessionStorage.getItem("mermaid_auth") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
      <div class="pl-4 pr-4 sm:pr-6 lg:pr-8">
        <div class="flex items-center justify-between h-16">
          <!-- Left Section -->
          <div class="flex items-center gap-2">
            <button
              onclick="toggleSidebar()"
              class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-indigo-600 transition-all duration-200"
              aria-label="Toggle sidebar"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
            <div class="hidden sm:flex items-center gap-2">
              <div>
                <h1 class="text-lg font-bold text-slate-900">Mermaid Editor</h1>
                <p class="text-xs text-slate-500">Live Diagram Creator</p>
              </div>
            </div>
          </div>

          <!-- Right Section -->
          <div class="flex items-center gap-2">
            <!-- User Info -->
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-50 rounded-lg border border-slate-200">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <span id="user-display-name" class="text-xs font-medium text-slate-600">user</span>
            </div>
            <!-- Admin Link (shown only for admin) -->
            <a id="admin-link" href="admin.html" class="hidden btn-primary flex items-center gap-2 px-3 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition-all duration-200 text-sm font-medium" title="Admin Panel">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span class="hidden sm:inline">Admin</span>
            </a>
            <!-- Cheatsheet -->
            <a href="cheatsheet.html" target="_blank" rel="noopener noreferrer" class="btn-primary flex items-center gap-2 px-3 py-2 bg-emerald-100 text-emerald-700 rounded-lg hover:bg-emerald-200 transition-all duration-200 text-sm font-medium">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
              <span class="hidden sm:inline">Cheatsheet</span>
            </a>
            <!-- Logout -->
            <button onclick="logout()" class="btn-primary flex items-center gap-2 px-3 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all duration-200 text-sm font-medium" title="Logout">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              <span class="hidden sm:inline">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="flex h-[calc(100vh-4rem)] relative">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="sidebar w-64 bg-white border-r border-slate-200 flex flex-col absolute md:relative h-full z-40"
      >
        <!-- Current Diagram Section -->
        <div class="px-3 py-3 border-b border-slate-200 bg-gradient-to-r from-indigo-50 to-purple-50">
          <div class="flex items-center justify-between mb-2">
            <h2 id="diagram-title" class="text-sm font-semibold text-slate-900 truncate flex-1">Untitled Diagram</h2>
            <button
              onclick="toggleRename()"
              class="p-1.5 rounded-lg text-slate-600 hover:bg-white/50 hover:text-indigo-600 transition-all duration-200"
              title="Rename diagram"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </button>
          </div>
          <input
            type="text"
            id="file-name"
            placeholder="Diagram name..."
            value="Untitled Diagram"
            class="hidden w-full px-2.5 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 bg-white mb-2"
          />
          <div class="space-y-1.5">
            <div class="flex gap-1.5">
              <button
                onclick="newFile()"
                class="btn-primary p-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-all duration-200"
                title="New diagram"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
              </button>
              <button
                id="save-btn"
                onclick="saveFile()"
                class="flex-1 btn-primary flex items-center justify-center gap-1.5 px-2.5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 shadow-md hover:shadow-lg transition-all duration-200"
                title="Save diagram"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                </svg>
                <span id="save-btn-text" class="text-xs font-medium">Save</span>
              </button>
              <button
                onclick="saveAsNew()"
                class="btn-primary p-2 bg-emerald-100 text-emerald-700 rounded-lg hover:bg-emerald-200 transition-all duration-200"
                title="Save as new copy"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- My Diagrams Section -->
        <div class="px-3 py-2.5 border-b border-slate-200 bg-slate-50">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <h2 class="text-xs font-semibold text-slate-600 uppercase tracking-wider">My Diagrams</h2>
              <div class="group relative">
                <svg class="w-3.5 h-3.5 text-slate-400 hover:text-indigo-500 cursor-help" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                <div class="absolute left-0 top-5 w-52 bg-slate-800 text-white text-xs rounded-lg px-3 py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 shadow-lg pointer-events-none">
                  Diagrams are saved in <strong>this browser only</strong>. Use Export/Import to transfer between browsers.
                  <div class="absolute -top-1 left-3 w-2 h-2 bg-slate-800 rotate-45"></div>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span id="file-count" class="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-xs rounded-full font-medium">0</span>
            </div>
          </div>
          <!-- Export/Import Buttons -->
          <div class="flex gap-1.5 mt-2">
            <button
              onclick="exportAllDiagrams()"
              class="flex-1 flex items-center justify-center gap-1.5 px-2 py-1.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg hover:bg-amber-100 transition-all duration-200 text-xs font-medium"
              title="Export all diagrams as backup file"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
              </svg>
              Export All
            </button>
            <button
              onclick="importDiagrams()"
              class="flex-1 flex items-center justify-center gap-1.5 px-2 py-1.5 bg-teal-50 text-teal-700 border border-teal-200 rounded-lg hover:bg-teal-100 transition-all duration-200 text-xs font-medium"
              title="Import diagrams from backup file"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
              </svg>
              Import
            </button>
          </div>
          <!-- Browser storage hint -->
          <p class="mt-1.5 text-[10px] text-amber-600 leading-tight flex items-start gap-1">
            <svg class="w-3 h-3 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            Saved in this browser only. Use Export to backup.
          </p>
        </div>

        <div id="file-list" class="flex-1 overflow-y-auto"></div>
      </aside>

      <!-- Editor Container -->
      <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Code Editor Section -->
        <div id="editor-section" class="flex flex-col bg-white border-b md:border-b-0 md:border-r border-slate-200" style="flex: 1 1 40%;">
          <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
              </svg>
              <span class="text-sm font-semibold text-slate-700">Editor</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-500 hidden sm:inline">Mermaid syntax</span>
              <button
                onclick="toggleWordWrap()"
                id="word-wrap-btn"
                aria-pressed="true"
                class="word-wrap-btn word-wrap-active flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-medium transition-all duration-200"
                title="Word wrap: ON (click to turn off)"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h7"></path>
                </svg>
                <span class="hidden sm:inline">Wrap</span>
              </button>
              <button
                onclick="toggleEditor()"
                id="toggle-editor-btn"
                class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-all duration-200"
                title="Collapse editor"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="flex-1 overflow-hidden">
            <textarea
              id="mermaid-code"
              placeholder="Enter your Mermaid diagram code here..."
              class="w-full h-full"
            >graph TD
    A[Start] --> B{Is it working?}
    B -->|Yes| C[Great!]
    B -->|No| D[Fix it]
    D --> B</textarea>
          </div>
        </div>

        <!-- Resizer -->
        <div id="resizer" class="resizer hidden md:block"></div>

        <!-- Preview Section -->
        <div id="preview-section" class="flex flex-col bg-white" style="flex: 1 1 60%;">
          <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <span class="text-sm font-semibold text-slate-700">Preview</span>
            </div>
            <div class="flex items-center gap-2">
              <button
                onclick="exportToPNG()"
                class="flex items-center gap-1.5 px-2.5 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200 transition-all duration-200 text-xs font-medium"
                title="Export as PNG"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span class="hidden sm:inline">Export PNG</span>
              </button>
              <button
                onclick="toggleEditor()"
                id="expand-editor-btn"
                class="hidden items-center gap-1.5 px-2.5 py-1.5 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition-all duration-200 text-xs font-medium"
                title="Show editor"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
                <span class="hidden sm:inline">Editor</span>
              </button>
              <span class="text-xs text-slate-500 hidden sm:inline">Live rendering</span>
              <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            </div>
          </div>

          <div id="preview" class="flex-1 relative overflow-hidden">
            <!-- Zoom Controls -->
            <div class="zoom-controls absolute bottom-4 right-4 flex items-center gap-1 rounded-lg p-1 shadow-lg z-10">
              <button
                onclick="zoomOut()"
                class="p-2 hover:bg-slate-100 rounded-lg transition-colors duration-200 text-slate-600"
                title="Zoom out"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                </svg>
              </button>
              <button
                onclick="resetZoom()"
                class="p-2 hover:bg-slate-100 rounded-lg transition-colors duration-200 text-slate-600 text-xs font-medium"
                title="Reset zoom"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
              </button>
              <button
                onclick="zoomIn()"
                class="p-2 hover:bg-slate-100 rounded-lg transition-colors duration-200 text-slate-600"
                title="Zoom in"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
              </button>
            </div>

            <div id="preview-container" class="preview-container">
              <div id="preview-content" class="preview-content"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/app.js?v=4"></script>
  </body>
</html>
